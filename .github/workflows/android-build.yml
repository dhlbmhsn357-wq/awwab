name: Android Build

# بناء APK أوّاب سحابيًا — الجهاز المحلي اللي بيشتغل عليه الكود
# مفيهوش Android SDK/Java خالص، فـGitHub Actions هي اللي بتبني
# الـAPK فعليًا. النتيجة بتترفع كـArtifact قابل للتحميل من تبويب
# Actions في الريبو، وتقدر تثبّته على موبايلك مباشرة.
on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'index.html'
      - 'manifest.json'
      - 'sw.js'
      - 'icon-*.png'
      - 'apple-touch-icon.png'
      - 'favicon-32.png'
      - 'vendor/**'
      - 'capacitor.config.ts'
      - 'package.json'
      - '.github/workflows/android-build.yml'
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install

      - name: Prepare web assets + sync Capacitor
        run: npm run cap:sync

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: awwab-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
